---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-qiujian16-github-com-qiujian16-github-com-v1-namespaceclass
  failurePolicy: Fail
  name: vnamespaceclass-v1.kb.io
  rules:
  - apiGroups:
    - qiujian16.github.com.qiujian16.github.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - namespaceclasses
  sideEffects: None
